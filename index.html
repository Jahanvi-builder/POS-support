<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>POS guided help — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E8E4F}a:hover{color:#003323}
button{font-family:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drain{from{width:100%}to{width:0%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
html,body{height:100%}
body{background:#EEF0F3;font-family:Inter,sans-serif;color:#2C3448;display:flex;align-items:center;justify-content:center;min-height:100vh}
.stage{box-sizing:border-box;padding:40px;display:flex;gap:40px;width:720px;max-width:100%}
@media (max-width:760px){body{align-items:flex-start}.stage{flex-direction:column;align-items:center;padding:16px;gap:24px;width:100%}.stage>div:last-child{width:100%;max-width:360px}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="stage">

<!-- PHONE -->
<div style="width: 360px; height: 640px; flex-shrink: 0; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); position: relative">
<div style="height: 24px; background: #003323; flex-shrink: 0"></div>

<!-- ============ FULL-SCREEN TOUCH TEST ============ -->
<sc-if value="{{isTest}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; background: #101418; min-height: 0">
<div style="padding: 14px 16px 10px; color: #FFFFFF; text-align: center; pointer-events: none">
<div style="font-size: 16px; font-weight: 600">Tap the green spot</div>
<div style="font-size: 13px; color: #B7BCC8; margin-top: 2px">{{testCount}}</div>
</div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 2px; background: #2A3038; min-height: 0">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.tap}}" aria-label="{{c.name}}" style="border: none; background: #101418; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0">
<sc-if value="{{c.active}}" hint-placeholder-val="{{ false }}">
<div style="width: 84px; height: 84px; border-radius: 42px; background: #50D387; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #003323; animation: pulse 1s ease-in-out infinite">Tap</div>
<div style="width: 84px; height: 4px; border-radius: 2px; background: #2A3038; overflow: hidden"><div style="height: 4px; background: #50D387; animation: drain 5s linear forwards"></div></div>
</sc-if>
<sc-if value="{{c.pass}}" hint-placeholder-val="{{ false }}">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#50D387" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
</sc-if>
<sc-if value="{{c.fail}}" hint-placeholder-val="{{ false }}">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F28B82" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</sc-if>
</button>
</sc-for>
</div>
<div style="padding: 10px 16px; text-align: center; font-size: 12px; color: #B7BCC8; pointer-events: none">No need to exit. The test ends by itself.</div>
</div>
</sc-if>

<!-- ============ NORMAL SCREENS ============ -->
<sc-if value="{{notTest}}" hint-placeholder-val="{{ true }}">

<!-- Header -->
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #DBDDE4">
<button onClick="{{back}}" aria-label="Back" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C3448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</button>
<div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 18px; font-weight: 500; line-height: 22px">{{title}}</div>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; color: #5A6580">{{subtitle}}</div></sc-if>
</div>
</div>

<!-- Help & Support (static, unchanged entry) -->
<sc-if value="{{isHelp}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{helpItems}}" as="it" hint-placeholder-count="4">
<button onClick="{{it.go}}" style="display: flex; align-items: center; gap: 16px; padding: 12px 4px; border: none; background: none; text-align: left; min-height: 56px; opacity: {{it.op}}">
<div style="width: 24px; height: 24px; border-radius: 12px; background: #E8F7EE; flex-shrink: 0"></div>
<div style="flex: 1"><div style="font-size: 16px; color: #2C3448">{{it.t}}</div><div style="font-size: 12px; color: #5A6580; margin-top: 2px">{{it.d}}</div></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#003323" stroke-width="2.5" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
</sc-for>
</div>
</sc-if>

<!-- ============ GUIDED FLOW: one conversation, starts at the top ============ -->
<sc-if value="{{isFlow}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column-reverse">
<div style="margin-bottom: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">

<sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px; animation: {{m.anim}}">

<sc-if value="{{m.isBot}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 14px; line-height: 21px; color: #2C3448; max-width: 304px">{{m.t}}<span style="font-weight: 700">{{m.b}}</span>{{m.t2}}</div>
</sc-if>

<sc-if value="{{m.isErr}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 14px; line-height: 21px; color: #B3261E; max-width: 304px">{{m.t}}</div>
</sc-if>

<sc-if value="{{m.isUser}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: flex-end">
<sc-if value="{{m.fixedReply}}" hint-placeholder-val="{{ true }}">
<div style="background: #EEF0F3; border-radius: 20px; padding: 10px 16px; font-size: 14px; color: #2C3448; max-width: 260px">{{m.t}}</div>
</sc-if>
<sc-if value="{{m.canChange}}" hint-placeholder-val="{{ false }}">
<button onClick="{{m.change}}" aria-label="{{m.changeAria}}" style="background: #EEF0F3; border: none; border-radius: 20px; min-height: 44px; padding: 10px 12px 10px 16px; font-size: 14px; color: #2C3448; max-width: 260px; display: inline-flex; align-items: center; gap: 8px; text-align: left">{{m.t}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#003323" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button>
</sc-if>
</div>
</sc-if>

<sc-if value="{{m.isBusy}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #495678">
<div style="width: 18px; height: 18px; border-radius: 9px; border: 3px solid #DBDDE4; border-top-color: #1E8E4F; animation: spin 0.9s linear infinite; flex-shrink: 0"></div>{{m.t}}
</div>
</sc-if>

<sc-if value="{{m.isStep}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #DBDDE4; border-radius: 8px; overflow: hidden; max-width: 300px">
<div style="height: 88px; background: #F4F5F7; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5A6580">{{m.img}}</div>
<div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 600; color: #1E7A45">{{m.cap}}</div>
<div style="font-size: 17px; line-height: 23px; font-weight: 600; color: #2C3448">{{m.title}}</div>
<div style="font-size: 13px; line-height: 19px; color: #495678">{{m.d}}</div>
</div>
</div>
</sc-if>

<sc-if value="{{m.isResult}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #DBDDE4; border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 14px; max-width: 300px">
<div style="width: 56px; height: 84px; border: 2px solid #2C3448; border-radius: 6px; padding: 3px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; flex-shrink: 0">
<sc-for list="{{m.zones}}" as="z" hint-placeholder-count="6">
<div style="background: {{z.bg}}; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: {{z.col}}">{{z.mark}}</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; color: #5A6580">Touch test result</div>
<div style="font-size: 13px; line-height: 18px; color: #2C3448">{{m.d}}</div>
</div>
</div>
</sc-if>

<sc-if value="{{m.isCard}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid {{m.border}}; background: {{m.bg}}; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; max-width: 300px">
<div style="font-size: 15px; font-weight: 600">{{m.title}}</div>
<sc-for list="{{m.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px"><span style="color: #5A6580; flex-shrink: 0">{{r.a}}</span><span style="font-weight: 500; text-align: right">{{r.b}}</span></div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{m.isTicket}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #DBDDE4; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; max-width: 300px">
<div style="align-self: flex-start; background: #FFE9A8; color: #5C4400; font-size: 12px; font-weight: 600; border-radius: 10px; padding: 2px 10px">Open</div>
<div style="font-size: 15px; font-weight: 600">{{m.title}}</div>
<div style="font-size: 12px; color: #5A6580">{{m.d}}</div>
</div>
</sc-if>

<sc-if value="{{m.isDone}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #A8DDBF; background: #EEF9F2; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E7A45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; font-weight: 600">{{m.title}}</div>
<div style="font-size: 13px; line-height: 19px; color: #495678">{{m.d}}</div>
</div>
</div>
</sc-if>

</div>
</sc-for>

<!-- ============ SELECTION: sizes itself to the number of options ============ -->
<sc-if value="{{hasOpts}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; order: {{optOrder}}; position: {{optPos}}; top: 0; background: #FFFFFF; z-index: 1; padding-bottom: 4px">

<sc-if value="{{optsTop}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 12px; color: #5A6580">Buttons moved up, because the bottom of the screen isn't responding.</div>
</sc-if>

<!-- one action: a single filled button -->
<sc-for list="{{actions}}" as="o" hint-placeholder-count="1">
<button onClick="{{o.pick}}" style="min-height: 48px; border-radius: 24px; border: none; background: #003323; color: #FFFFFF; font-size: 15px; font-weight: 600; padding: 8px 16px">{{o.label}}</button>
</sc-for>

<!-- the request: a quieter, hug-width green pill -->
<sc-for list="{{reqPills}}" as="o" hint-placeholder-count="1">
<button onClick="{{o.pick}}" style="align-self: flex-start; min-height: 46px; border-radius: 24px; border: none; background: #003323; color: #FFFFFF; font-size: 15px; font-weight: 600; padding: 6px 18px 6px 20px; display: inline-flex; align-items: center; gap: 8px">{{o.label}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 5v8h10"/><path d="M13 9l4 4-4 4"/></svg></button>
</sc-for>

<!-- 2 to 3 answers: pills -->
<sc-if value="{{isPills}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
<sc-for list="{{answers}}" as="o" hint-placeholder-count="2">
<button onClick="{{o.pick}}" style="min-height: 44px; border-radius: 22px; border: 1px solid #003323; background: #FFFFFF; color: #2C3448; font-size: 14px; font-weight: 500; padding: 6px 16px 6px 18px; display: inline-flex; align-items: center; gap: 8px; text-align: left; opacity: {{o.op}}">{{o.label}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#003323" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 5v8h10"/><path d="M13 9l4 4-4 4"/></svg></button>
</sc-for>
</div>
</sc-if>

<!-- 4 or more answers: compact list, with More from 7 -->
<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #DBDDE4; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{answers}}" as="o" hint-placeholder-count="5">
<button onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; min-height: 48px; border: none; border-bottom: 1px solid #EEF0F3; background: #FFFFFF; text-align: left; font-size: 15px; color: #2C3448; opacity: {{o.op}}">
<span>{{o.label}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#003323" stroke-width="2.5" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</button>
</sc-for>
<sc-if value="{{showMore}}" hint-placeholder-val="{{ false }}">
<button onClick="{{moreGo}}" style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; min-height: 48px; border: none; background: #F7F8FA; text-align: left; font-size: 15px; color: #495678">
<span>More</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#495678" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>
</sc-if>
</div>
</sc-if>

<!-- the quiet last resort -->
<sc-for list="{{quiet}}" as="o" hint-placeholder-count="1">
<button onClick="{{o.pick}}" style="align-self: flex-start; border: none; background: none; font-size: 13px; color: #495678; text-decoration: underline; padding: 10px 4px; min-height: 44px">{{o.label}}</button>
</sc-for>

</div>
</sc-if>

</div>
</div>

<!-- number pad: the only place the merchant types -->
<sc-if value="{{padOn}}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; border-top: 1px solid #DBDDE4; background: #F7F8FA; padding: 10px 16px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; color: #5A6580">{{padLabel}}</div>
<div style="height: 44px; border: 1.5px solid #003323; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; color: #2C3448">{{padShown}}</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{padKeys}}" as="k" hint-placeholder-count="12">
<button onClick="{{k.tap}}" aria-label="{{k.aria}}" style="height: 40px; border-radius: 8px; border: 1px solid #DBDDE4; background: #FFFFFF; font-size: 18px; font-weight: 500; color: #2C3448; opacity: {{k.op}}">{{k.t}}</button>
</sc-for>
</div>
<button onClick="{{padGo}}" style="height: 46px; border-radius: 24px; border: none; background: #003323; color: #FFFFFF; font-size: 15px; font-weight: 600; opacity: {{padGoOp}}">{{padCta}}</button>
<button onClick="{{padCancel}}" style="align-self: center; border: none; background: none; font-size: 13px; color: #495678; text-decoration: underline; min-height: 30px">Use the registered number instead</button>
</div>
</sc-if>
</sc-if>

<!-- Leave sheet -->
<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 24px; bottom: 40px; background: rgba(0,0,0,0.45); display: flex; flex-direction: column; justify-content: flex-end; z-index: 5">
<div style="background: #FFFFFF; border-radius: 16px 16px 0 0; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 17px; font-weight: 600">Leave this check?</div>
<div style="font-size: 14px; line-height: 20px; color: #495678">We'll save your progress. You can continue from Help &amp; Support.</div>
<button onClick="{{stay}}" style="height: 48px; border-radius: 24px; border: none; background: #003323; color: #FFFFFF; font-size: 15px; font-weight: 600; margin-top: 6px">Keep going</button>
<button onClick="{{startOver}}" style="height: 48px; border-radius: 24px; border: 1.5px solid #003323; background: #FFFFFF; color: #003323; font-size: 15px; font-weight: 600">Start over</button>
<button onClick="{{leave}}" style="height: 48px; border: none; background: none; color: #003323; font-size: 15px; font-weight: 600">Leave</button>
</div>
</div>
</sc-if>

</sc-if>

<div style="height: 40px; background: #000; flex-shrink: 0; display: flex; align-items: center; justify-content: space-around">
<div style="width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 11px solid #FFF"></div>
<div style="width: 14px; height: 14px; border-radius: 7px; border: 2px solid #FFF"></div>
<div style="width: 12px; height: 12px; background: #FFF"></div>
</div>
</div>

<!-- SIDE PANEL -->
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 8px">
<div style="font-size: 12px; font-weight: 600; color: #5A6580; letter-spacing: 0.06em">PROTOTYPE NOTES</div>
<div style="font-size: 18px; font-weight: 700; line-height: 24px">Guided flow from Log a complaint</div>
<div style="font-size: 12px; line-height: 17px; color: #2C3448; display: flex; flex-direction: column; gap: 6px">
<div style="border: 1px solid #DBDDE4; border-radius: 8px; padding: 8px 10px"><b>Built:</b> Power and charging, Screen and buttons. Greyed options aren't built.</div>
<div style="border: 1px solid #DBDDE4; border-radius: 8px; padding: 8px 10px"><b>Touch test:</b> tap a green spot to pass it, or leave it 5 seconds to miss it. Missed spots get a second try.</div>
<div style="border: 1px solid #DBDDE4; border-radius: 8px; padding: 8px 10px"><b>Changing an answer:</b> tap your last reply (it shows a pencil) or press back. Once a check has run, back offers Keep going, Start over or Leave.</div>
</div>
<sc-for list="{{toggles}}" as="tg" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; font-weight: 600; color: #2C3448">{{tg.label}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tg.items}}" as="x" hint-placeholder-count="2">
<button onClick="{{x.pick}}" style="min-height: 34px; border-radius: 8px; border: 1.5px solid {{x.border}}; background: {{x.bg}}; font-size: 12px; font-weight: 600; color: #2C3448; padding: 5px 9px">{{x.label}}</button>
</sc-for>
</div>
</div>
</sc-for>
<button onClick="{{restart}}" style="height: 40px; border-radius: 20px; border: 1.5px solid #2C3448; background: transparent; font-size: 13px; font-weight: 600; color: #2C3448; margin-top: 4px">Restart prototype</button>
</div>

</div>
</template>
<script>
/* Tiny renderer: reads the template above, fills {{holes}} from renderVals(), and redraws on setState. */
class DCLogic {
  constructor() { this.state = {}; }
  setState(u) { Object.assign(this.state, u); if (!this._q) { this._q = true; Promise.resolve().then(() => { this._q = false; draw(this); }); } }
}
function look(path, scope) {
  path = path.trim(); if (path === 'true') return true; if (path === 'false') return false;
  const parts = path.split('.'); let v;
  for (let s = scope; s; s = s.up) { if (parts[0] in s.vars) { v = s.vars[parts[0]]; break; } }
  for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
  return v;
}
const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
const fill = (str, scope) => str.replace(/\{\{([^}]+)\}\}/g, (m, p) => { const v = look(p, scope); return v == null ? '' : v; });
function build(node, scope, out) {
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(fill(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.localName;
  if (tag === 'sc-if') { const m = WHOLE.exec(node.getAttribute('value') || ''); if (m && look(m[1], scope)) node.childNodes.forEach((c) => build(c, scope, out)); return; }
  if (tag === 'sc-for') {
    const m = WHOLE.exec(node.getAttribute('list') || ''); const list = (m && look(m[1], scope)) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const vars = { $index: i }; vars[as] = item; node.childNodes.forEach((c) => build(c, { vars: vars, up: scope }, out)); });
    return;
  }
  const el = node.cloneNode(false);
  for (const at of Array.from(node.attributes)) {
    if (at.name.startsWith('hint-')) { el.removeAttribute(at.name); continue; }

        else if (sc === 'fine') { e = [{ k: 'bot', t: '', b: 'Your device is charging normally.', t2: '' }, this.pcard('Pine Labs charger', 'Working', 'Good'), { k: 'bot', t: "What's still wrong?" }]; op = [{ id: 'toDrain', label: 'Battery runs out fast' }, { id: 'else', label: "It's something else" }, { id: 'works0', label: "It's working now" }]; }
        else { const f = this.offerP(0); e = [{ k: 'bot', t: '', b: 'No power is reaching the device.', t2: " Let's find out why." }, this.pcard('Pine Labs charger', 'No power coming in', 'Good')].concat(f.entries); op = f.opts; }
        this.setState({ hist: hist.concat(e), opts: op, pfixI: 0 });
      });
      return;
    }
    if (id === 'pDo') {
      const i = this.state.pfixI;
      this.busyThen(L, 'Checking for charging…', 1800, (hist) => {
        if (this.state.scen === 'socket' && i === 0) this.setState({ hist: hist.concat([{ k: 'done', title: 'Charging now', d: "The wall socket was the problem. Your device is charging normally. We'll check in tomorrow." }]), opts: done });
        else if (i < 2) this.setState({ hist: hist.concat([{ k: 'bot', t: '', b: 'Still no charging detected.', t2: '' }]), opts: [{ id: 'pNext', label: 'Try another fix', primary: true }] });
        else this.setState({ hist: hist.concat([{ k: 'bot', t: '', b: 'Still no charging detected.', t2: ' Do you have another Pine Labs charger or cable to try?' }]), opts: [{ id: 'spYes', label: 'Yes, it charges with the other one' }, { id: 'spNo', label: 'Yes, but still not charging' }, { id: 'spNone', label: "No, I don't have a spare" }] });
      });
      return;
    }
    if (id === 'pNext') { const i = this.state.pfixI + 1; const f = this.offerP(i); this.step(L, f.entries, f.opts, true, { pfixI: i }); return; }
    if (id === 'spYes') { this.step(L, [{ k: 'bot', t: 'Then ', b: 'the charger or cable is faulty', t2: ". We'll send a replacement." }, this.sum([{ a: 'Problem', b: "Won't charge" }, { a: 'Part to replace', b: 'Charger or cable' }, { a: 'Already tried', b: 'Other socket, cable reconnected, port cleaned' }, { a: 'Diagnostic report', b: 'Attached' }])], this.raiseOpts(true), true); return; }
    if (id === 'spNo' || id === 'spNone') { this.step(L, [{ k: 'bot', t: 'Then ', b: 'the charging port most likely needs a repair', t2: '.' }, this.sum([{ a: 'Problem', b: "Won't charge" }, { a: 'Part to check', b: 'Charging port' }, { a: 'Already tried', b: 'Other socket, cable reconnected, port cleaned' }, { a: 'Diagnostic report', b: 'Attached' }])], this.raiseOpts(true), true); return; }
    if (id === 'chgRe') { this.busyThen(L, 'Checking for charging…', 1800, (hist) => this.setState({ hist: hist.concat([{ k: 'done', title: 'Charging now', d: "The Pine Labs charger is working. Use only this charger from now on. We'll check in tomorrow." }]), opts: done })); return; }
    if (id === 'chgNo') { this.step(L, [{ k: 'bot', t: "We'll send you a Pine Labs charger. ", b: 'No engineer visit is needed.', t2: '' }, this.sum([{ a: 'Problem', b: 'Wrong charger in use' }, { a: 'Needs', b: 'Pine Labs charger' }, { a: 'Diagnostic report', b: 'Attached' }])], this.raiseOpts(false), false); return; }
    if (id === 'dStart' || id === 'toDrain') { this.runDrain(L); return; }
    if (id === 'dFix') { this.busyThen(L, 'Lowering brightness and closing apps…', 1800, (hist) => this.setState({ hist: hist.concat([{ k: 'done', title: 'Battery saver applied', d: "Brightness is lower and background apps are closed. We'll check your battery use tomorrow." }]), opts: done })); return; }

    /* request */
    if (id === 'raise') { this.step(L, [{ k: 'bot', t: 'Which number should we call?' }], [{ id: 'numThis', label: '98XXX XXXXX (registered)' }, { id: 'numOther', label: 'A different number' }], false); return; }
    if (id === 'numOther') { this.step(L, [{ k: 'bot', t: 'Type the number we should call.' }], [], true, { pad: { mode: 'num', val: '', num: '' } }); return; }
    if (id === 'numThis') { this.raiseNow(L, '98XXX XXXXX'); return; }
    if (id === 'retryRaise') { this.raiseNow(L, this.state.num); return; }
    if (id === 'cancelReq') { this.step(L, [{ k: 'bot', t: 'No request was raised. You can come back anytime from Help & Support.' }], done, true); return; }

  }
  restart() { this.clearAll(); const st = this.state; this.setState(Object.assign(this.fresh(), { scen: st.scen, openReq: st.openReq, failMode: st.failMode })); }

  renderVals() {
    const st = this.state; const scr = st.screen;
    const helpItems = [
      { t: 'My Requests', d: 'View open and closed requests' },

    ].map((h) => ({ t: h.t, d: h.d, op: h.on ? 1 : 0.55, go: h.on ? () => this.enterFlow() : () => {} }));

    const names = ['Top left', 'Top right', 'Middle left', 'Middle right', 'Bottom left', 'Bottom right'];
    const cur = st.tq[st.tpos];
    const cells = names.map((n, i) => ({ name: n, active: i === cur, pass: st.tmap[i] === true, fail: st.tmap[i] === false, tap: () => { const z = this.state; if (z.tq[z.tpos] === i) this.mark(true); } }));
    const testCount = st.tpass === 2 ? 'Second try for missed spots · ' + Math.min(st.tpos + 1, st.tq.length) + ' of ' + st.tq.length : 'Spot ' + Math.min(st.tpos + 1, 6) + ' of 6';
    const pd = st.pad; const isNum = pd && pd.mode === 'num';
    const padKeys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map((k) => ({ t: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Delete' : (k || 'Blank'), op: k === '' ? 0 : 1, tap: () => { if (k !== '') this.padKey(k); } }));
    const padVal = pd ? pd.val : '';
    const padShown = !pd ? '' : (isNum ? '+91 ' + padVal.slice(0, 5) + (padVal.length > 5 ? ' ' + padVal.slice(5) : '') : padVal.split('').join(' '));
    const padValid = pd && padVal.length === (isNum ? 10 : 4);
    const topUndo = st.undo.length ? st.undo[st.undo.length - 1].n : -1;
    const tones = { info: ['#8CCBEA', '#EAF6FC'], ok: ['#A8DDBF', '#EEF9F2'], plain: ['#DBDDE4', '#FFFFFF'] };
    const msgs = st.hist.map((h, i) => {
      const m = { anim: i >= (this._seen || 0) ? 'fadeUp 0.28s ease-out' : 'none', t: h.t || '', b: h.b || '', t2: h.t2 || '', cap: h.cap || '', title: h.title, d: h.d, img: h.img, rows: h.rows || [],
        isBot: h.k === 'bot', isErr: h.k === 'err', isUser: h.k === 'user', isBusy: h.k === 'busy', isStep: h.k === 'step', isResult: h.k === 'result', isCard: h.k === 'card', isDone: h.k === 'done', isTicket: h.k === 'ticket',
        canChange: h.k === 'user' && i === topUndo, fixedReply: h.k === 'user' && i !== topUndo, changeAria: 'Change answer: ' + (h.t || ''), change: () => this.change(), zones: [] };
      if (h.k === 'result') m.zones = h.zones.map((ok) => ({ bg: ok ? '#1E8E4F' : '#FBE3E1', col: ok ? '#FFFFFF' : '#B3261E', mark: ok ? '✓' : '✕' }));
      if (h.k === 'card') { const c = tones[h.tone] || tones.plain; m.border = c[0]; m.bg = c[1]; }
      return m;
    });

    /* the selection sizes itself: pills for up to 3 answers, a list for more, a More row from 7 */
    const mk = (o) => ({ label: o.label, op: o.off ? 0.45 : 1, pick: () => this.pick(o) });
    const actions = st.opts.filter((o) => o.primary && o.id !== 'raise').map(mk);
    const reqPills = st.opts.filter((o) => o.primary && o.id === 'raise').map(mk);
    const quiet = st.opts.filter((o) => o.quiet).map(mk);
    const allAnswers = st.opts.filter((o) => !o.primary && !o.quiet);
    const isList = allAnswers.length > 3;
    const collapsed = allAnswers.length >= 7 && !st.more;
    const answers = (collapsed ? allAnswers.slice(0, 5) : allAnswers).map(mk);

    const T = (label, key, items) => ({ label: label, items: items.map((x) => ({ label: x[1], border: st[key] === x[0] ? '#003323' : '#DBDDE4', bg: st[key] === x[0] ? '#FFFFFF' : 'transparent', pick: () => { const u = {}; u[key] = x[0]; this.setState(u); } })) });
    const toggles = [
      T('The power check finds:', 'scen', [['battery', 'Battery failing'], ['charger', 'Wrong charger'], ['socket', 'Socket was the problem'], ['port', 'Faulty part'], ['fine', 'Charging is fine']]),
      T('Open request on this device:', 'openReq', [['no', 'None'], ['yes', 'One is open']]),
      T('Raising a request:', 'failMode', [['no', 'Works'], ['yes', 'Fails the first time']])
    ];
    const answered = st.hist.some((h) => h.k === 'user');

    return {
      isTest: scr === 'test', notTest: scr !== 'test', isHelp: scr === 'help', isStart: scr === 'start', isFlow: scr === 'flow', goDevice: () => this.enterFlow(),
      padOn: !!pd && scr === 'flow', padLabel: isNum ? 'Mobile number · 10 digits' : 'Code sent to ' + (pd ? pd.num : ''), padShown: padShown, padKeys: padKeys, padCta: isNum ? 'Send code' : 'Verify and raise request', padGoOp: padValid ? 1 : 0.4, padGo: () => this.padGo(), padCancel: () => this.padCancel(),
      title: scr === 'help' ? 'Help & Support' : st.ftitle, subtitle: st.fsub, hasSub: scr === 'flow' && !!st.fsub,
      back: () => { if (scr === 'start') this.restart(); else if (scr === 'flow') { if (st.undo.length && !st.pad) this.change(); else if (answered) this.setState({ sheet: true }); else this.restart(); } },
      startOver: () => this.enterFlow(),
      helpItems: helpItems, cells: cells, testCount: testCount,
      msgs: msgs, hasOpts: st.opts.length > 0, actions: actions, reqPills: reqPills, answers: answers, quiet: quiet,
      isPills: !isList && answers.length > 0, isList: isList, showMore: collapsed, moreGo: () => this.setState({ more: true }),
      optsTop: st.optsTop, optOrder: st.optsTop ? -1 : 0, optPos: st.optsTop ? 'sticky' : 'static',
      sheet: st.sheet && scr === 'flow', stay: () => this.setState({ sheet: false }), leave: () => this.restart(),
      toggles: toggles, restart: () => this.restart()

  }
